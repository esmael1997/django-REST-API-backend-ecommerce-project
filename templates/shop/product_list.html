<!DOCTYPE html>
<html>

<head>
    <title>Product List</title>
</head>

<body>

    <h1>Products</h1>

    {% for product in products %}
    <div style="border:1px solid #ccc; padding:10px; margin:10px;">
        <h2>{{ product.title }}</h2>
        <p>{{ product.price }} $</p>
        <p>{{ product.category.name }}</p>
    </div>
    {% empty %}
    <p>No products found</p>
    {% endfor %}

</body>

</html>
