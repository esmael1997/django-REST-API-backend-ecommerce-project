<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>{{ product.title }}</title>
  </head>
  <body>
    <h1>{{ product.title }}</h1>

    <hr />

    <p>Category:
      {{ product.category.name }}</p>

    <p>Price:
      {{ product.price }} $</p>

    <p>Stock:
      {{ product.stock }}</p>

    <p>Available:
      {{ product.available }}</p>

    <hr />

    <p>{{ product.description }}</p>
  </body>
</html>
