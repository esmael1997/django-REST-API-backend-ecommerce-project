version: "3.9"

services:
  db:
    container_name: db
    image: postgres:15-alpine
    volumes:
    services:
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      #POSTGRES_HOST_AUTH_METHOD: trust

'''
